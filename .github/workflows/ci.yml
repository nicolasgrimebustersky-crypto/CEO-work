name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A newer push to the same branch makes the in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      # Pure unit tests — no emulator, no network.
      - run: npm run test:meta
      # Builds with blank Firebase keys on purpose: the app has to compile and
      # render its setup screen without credentials, which is the state of a
      # fresh clone.
      - run: npm run build

  rules:
    name: Security rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The Firestore and Storage emulators are Java processes.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run test:rules

  api:
    name: API auth and rate limits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      # Stands up emulators, seeds two crew accounts, builds and boots the app,
      # then checks the allowlist, the cron secret and the SMS spend ceiling.
      - run: npm run test:api
