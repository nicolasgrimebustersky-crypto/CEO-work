# Publishing the security rules, so the repo and the live project cannot drift.
#
# Before this existed, `firestore.rules` in git and the rules actually running in
# Firebase were two different things kept in sync by somebody remembering. They
# drifted, and the first anyone noticed was the app being refused by its own
# database.
#
# Two properties matter more than the convenience:
#
#   1. It never runs on a pull request. A branch — from a fork or otherwise —
#      must not be able to rewrite the rules protecting real customer records.
#      Only a commit that reached `main` publishes.
#   2. The emulator tests are the gate. Publishing from the Firebase console
#      will ship anything that parses; this ships only what 123 tests agree is
#      correct. That gate, not the automation, is the point.
name: Publish security rules

on:
  push:
    branches: [main]
    # Nothing else changes what the database enforces, so nothing else needs a
    # publish. Merges that touch only application code skip this entirely.
    paths:
      - firestore.rules
      - storage.rules
      - firebase.json
      - .github/workflows/deploy-rules.yml
  # For republishing after a failed run without having to push an empty commit.
  workflow_dispatch:

# One publish at a time, and never cancel one halfway: an interrupted deploy
# leaves the question of which ruleset is live, which is worse than waiting.
concurrency:
  group: publish-rules
  cancel-in-progress: false

jobs:
  publish:
    name: Publish rules to Firebase
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # The Firestore and Storage emulators are Java processes.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci

      # The gate. If a rule would lock the crew out of their own jobs, or let
      # one customer's record be read by an unapproved account, it fails here
      # and nothing reaches the live project.
      - name: Test the rules before publishing them
        run: npm run test:rules

      # The credential reaches firebase-tools as a file, so it has to touch disk.
      # It goes to the runner's temp directory — never the workspace, where a
      # later step could commit it — and is shredded in the always() step below
      # whether the deploy succeeded or not.
      #
      # It is read by lib/serviceAccountKey.ts, the same parser the app uses for
      # FIREBASE_SERVICE_ACCOUNT_KEY, so base64 and raw JSON both work and the
      # ways a paste arrives mangled — wrapping quotes, a newline a textarea
      # added, whitespace through the middle of a base64 line — are already
      # handled and already tested. Base64 is the form to prefer: one line, no
      # quotes, no backslashes, nothing for a terminal copy to mangle.
      #
      # The checks exist because the first two runs failed on the credential and
      # firebase-tools said only "Failed to authenticate, have you run firebase
      # login?" — which is what it says for a mangled paste, a deleted key, the
      # wrong file and the wrong project alike.
      - name: Write the deploy credential
        env:
          FIREBASE_DEPLOY_KEY: ${{ secrets.FIREBASE_DEPLOY_KEY }}
          EXPECTED_PROJECT: grimeline-5e3d8
          CREDENTIAL_PATH: ${{ runner.temp }}/rules-deployer.json
        run: |
          node --experimental-strip-types --input-type=module -e '
            import { writeFileSync } from "node:fs";
            const { serviceAccountJson } = await import("./lib/serviceAccountKey.ts");

            const raw = process.env.FIREBASE_DEPLOY_KEY ?? "";
            const fail = (m) => { console.log(`::error::${m}`); process.exit(1); };

            if (!raw.trim()) {
              fail(
                "FIREBASE_DEPLOY_KEY is not set. Add the rules-deployer service " +
                "account key as a repository secret — see README.",
              );
            }

            // Length and first character only. Never the value: it is a private key.
            const json = serviceAccountJson(raw);
            if (!json) {
              fail(
                `FIREBASE_DEPLOY_KEY is ${raw.trim().length} characters but is ` +
                `neither the service account JSON nor a base64 copy of it (it ` +
                `starts with "${raw.trim()[0]}"). In Cloud Shell run ` +
                `"base64 -w0 rules-deployer.json" and paste that one line, which ` +
                `has no quotes or backslashes for a copy to mangle.`,
              );
            }

            let key;
            try {
              key = JSON.parse(json);
            } catch {
              fail("The credential decoded but is not valid JSON. It was cut short.");
            }

            if (key.type !== "service_account") {
              fail(
                `The credential is JSON but its "type" is "${key.type ?? "missing"}", ` +
                `not "service_account". This is not a service account key file.`,
              );
            }

            const missing = ["client_email", "private_key", "project_id"]
              .filter((field) => !key[field]);
            if (missing.length) {
              fail(`The service account JSON is missing: ${missing.join(", ")}.`);
            }

            if (key.project_id !== process.env.EXPECTED_PROJECT) {
              fail(
                `That key belongs to project "${key.project_id}", but this workflow ` +
                `deploys to "${process.env.EXPECTED_PROJECT}".`,
              );
            }

            // The decoded document, not a rebuild from its fields: firebase-tools
            // reads token_uri and the rest, which a rebuild would drop.
            writeFileSync(process.env.CREDENTIAL_PATH, json, { mode: 0o600 });
            console.log(`Deploying as ${key.client_email}`);
            console.log(`Project ${key.project_id}`);
          '

      # Indexes are deliberately absent. An index deploy can propose deleting
      # indexes that exist in the project but not in the file, and silently
      # dropping an index turns a working query into a runtime error. That stays
      # a decision somebody makes on purpose.
      #
      # "storage" and not "storage:rules", which is the obvious-looking spelling
      # and wrong. In --only, what follows the colon is a deploy *target* name,
      # not a thing to deploy: firebase-tools reads "storage:rules" as the storage
      # target called "rules", finds no such target in firebase.json, and fails
      # with "Could not find rules for the following storage targets: rules".
      # Only a bare "storage" deploys the storage rules — see
      # firebase-tools/lib/deploy/storage/prepare.js, where split.includes(
      # "storage") is what sets allStorage. Firestore is the exception that
      # invites the mistake: "firestore:rules" is real, because firestore
      # genuinely has rules and indexes to choose between.
      - name: Publish
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/rules-deployer.json
        run: |
          npx firebase deploy \
            --only firestore:rules,storage \
            --project grimeline-5e3d8 \
            --non-interactive

      - name: Remove the credential
        if: always()
        run: rm -f "$RUNNER_TEMP/rules-deployer.json"
