name: Codex automated review

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review, synchronize]

# The review job can read source code; only the feedback and auto-merge jobs
# receive permissions to write to the pull request.
permissions:
  contents: read

concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Every pull request to main is reviewed, drafts included.
    #
    # This used to read `draft == false && user.login == 'claude[bot]'`, and
    # between them those two conditions meant the review never ran once. Claude
    # pushes with a user token, so the author is a person, not claude[bot]; and
    # Claude opens pull requests as drafts. Each condition alone was enough to
    # skip the job — and because the gate below treated a skipped review as a
    # pass, every pull request carried a green "Codex review gate" that had
    # reviewed nothing. #58, which changed security rules, merged that way.
    #
    # There is no author condition now. Distinguishing authors is what caused
    # this, the business is one person, and "review everything" is the
    # instruction. Drafts are included because a draft is where the work
    # actually is: review that arrives only once somebody marks a pull request
    # ready is review that arrives after the thinking is done.
    runs-on: ubuntu-latest
    outputs:
      final_message: ${{ steps.codex.outputs.final-message }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch pull-request refs
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags origin "$PR_BASE_REF" "+refs/pull/$PR_NUMBER/head"

      - name: Review with Codex
        id: codex
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt: |
            Review only the changes in PR #${{ github.event.pull_request.number }}.
            Compare the diff, the PR description, and AGENTS.md. Look for missed
            requirements, incorrect behavior, security/privacy problems, missing
            verification, and unnecessary scope.

            If and only if there are no actionable findings, your entire final
            response must be exactly: CODEX_APPROVED

            Otherwise, your entire final response must begin with @claude on its
            own line, followed by concise, specific correction instructions.
            Include the relevant file and expected behavior for every finding.
            Do not approve a PR with unresolved actionable findings.

  post_feedback:
    needs: review
    if: >-
      always() &&
      needs.review.result == 'success' &&
      needs.review.outputs.final_message != 'CODEX_APPROVED'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - name: Send corrections to Claude
        uses: actions/github-script@v7
        env:
          CODEX_FEEDBACK: ${{ needs.review.outputs.final_message }}
        with:
          github-token: ${{ github.token }}
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: process.env.CODEX_FEEDBACK,
            });

  review_gate:
    name: Codex review gate
    needs: [review, post_feedback]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require Codex approval
        env:
          REVIEW_RESULT: ${{ needs.review.result }}
          FINAL_MESSAGE: ${{ needs.review.outputs.final_message }}
        run: |
          # A review that did not run is not an approval. This branch used to
          # `exit 0`, which is how a skipped job became a green gate — the
          # single line that let every pull request through unreviewed. It fails
          # now, so the same mistake is loud instead of silent, whatever future
          # condition causes the job to be skipped.
          if [ "$REVIEW_RESULT" = "skipped" ]; then
            echo 'The Codex review job did not run, so this PR is unreviewed.'
            echo 'A skipped review is not an approval. Check the review job'\''s'
            echo 'conditions in .github/workflows/codex-auto-review.yml.'
            exit 1
          fi
          if [ "$REVIEW_RESULT" = "success" ] && [ "$FINAL_MESSAGE" = "CODEX_APPROVED" ]; then
            exit 0
          fi
          echo 'Codex requested corrections or could not complete the review.'
          exit 1

# There is deliberately no auto-merge job here.
#
# One used to squash-merge any pull request the gate passed. With the gate
# passing on skipped reviews, that was a path from "Claude opened a pull
# request" to "it is on main" with nothing having read the diff. Merging is the
# maintainer's, and a Codex approval is an input to that decision rather than a
# substitute for it.
